<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>CampusHub</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="fonts/inter.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    /* Apply the saved theme before first paint so there is no light/dark flash. */
    try {
      if (JSON.parse(localStorage.getItem('ch_theme')) === 'dark') {
        document.documentElement.dataset.theme = 'dark';
        document.querySelector('meta[name=theme-color]').content = '#060b16';
      }
    } catch (e) { /* storage unavailable: default light theme */ }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="loader" class="loader-overlay" hidden>
    <div class="loader-ring"></div>
    <p id="loaderText">Loading...</p>
  </div>
  <noscript>CampusHub needs JavaScript to run.</noscript>
  <script src="app.js"></script>
</body>
</html>
